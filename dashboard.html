<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pipeline Monitor</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./js/app.js"></script>
  <style>
    :root { color-scheme: light }
    body { margin: 0 }
    #loading { padding: 24px; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #5e6c84 }
    #err { padding: 24px; font: 13px/1.5 monospace; color: #c9372c; white-space: pre-wrap }
  </style>
</head>
<body>
  <div id="root"><div id="loading">Memuat data board…</div></div>

  <script>
    var t = TrelloPowerUp.iframe();

    function load() {
      return Promise.all([
        t.board('id', 'name'),
        t.lists('id', 'name'),
        t.cards('id', 'name', 'idList', 'labels', 'badges', 'url', 'closed', 'desc')
      ]).then(function (res) {
        var board = res[0], lists = res[1], cards = res[2];
        cards = cards.filter(function (c) { return !c.closed; });

        PipelineMonitor.render({
          el: document.getElementById('root'),
          lists: lists,
          cards: cards,
          boardName: board.name,
          onOpenCard: function (id) { t.showCard(id); },
          onRefresh: function () {
            document.getElementById('root').innerHTML = '<div id="loading">Memuat ulang…</div>';
            load();
          }
        });
      }).catch(function (e) {
        document.getElementById('root').innerHTML =
          '<div id="err">Gagal memuat data:\n' + (e && e.message ? e.message : e) + '</div>';
      });
    }

    load();
  </script>
</body>
</html>
